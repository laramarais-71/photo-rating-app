<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Photo Vote</title>
<link rel="stylesheet" href="style.css" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600&family=Inter:wght@400;500&display=swap" rel="stylesheet" />
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="frame"></span> Photo Vote</div>
    <nav><a href="admin.html">Admin</a></nav>
  </header>

  <main class="vote-layout">
    <section class="stage" id="stage">
      <div class="stage-empty" id="emptyState">
        <h2>Loading photos&hellip;</h2>
        <p>Hang tight while the pool loads.</p>
      </div>
    </section>

    <aside class="pool">
      <h3>Photo pool</h3>
      <div class="pool-grid" id="poolGrid"></div>
    </aside>
  </main>

  <script src="main.js"></script>
</body>
</html>
